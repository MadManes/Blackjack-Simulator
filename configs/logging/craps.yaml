version: 1
disable_existing_loggers: false
formatters:
  json:
    format: '{"ts":"%(asctime)s","lvl":"%(levelname)s","lg":"%(name)s","msg":%(message)s}'
handlers:
  debug_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    filename: logs/craps/debug.ndjson
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    formatter: json
loggers:
  craps.debug:
    level: DEBUG
    handlers: [debug_file]
    propagate: false
root:
  level: WARNING
  handlers: []
